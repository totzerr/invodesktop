name: Publier Sway Desktop

on:
  push:
    branches:
      - sway-liquid-glass
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer Sway
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer le site
        run: |
          touch .nojekyll
          rm -rf .git .github tests supabase

      - name: Envoyer les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
